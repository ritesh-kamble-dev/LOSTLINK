spring.application.name=LostAndFound

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/LostandFoundDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootRK}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:myLostAndFoundJwtSecretKey2026ForCollegeProject123}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}